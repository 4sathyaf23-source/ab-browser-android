name: Build AB Android
on:
  workflow_dispatch:
  push:
    paths:
      - 'ab-browser-android-project/android/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: ab-browser-android-project/android
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ab-browser-android-debug
          path: ab-browser-android-project/android/app/build/outputs/apk/debug/*.apk
